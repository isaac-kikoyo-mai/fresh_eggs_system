{% extends 'base.html' %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-info text-white">

        <h4>
            📦 Add Inventory
        </h4>

    </div>

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            {% for field in form %}

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    {{ field.label }}
                </label>

                {{ field }}

                {% if field.errors %}
                <div class="text-danger small mt-1">
                    {{ field.errors }}
                </div>
                {% endif %}

            </div>

            {% endfor %}

    

            <button type="submit"
                    class="btn btn-primary">

                Save Inventory

            </button>

            <a href="/"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

    {% endblock %}
